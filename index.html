<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laptop Bishkek: где поработать с ноутбуком</title>
  <meta name="description" content="Кафе и коворкинги Бишкека для работы с ноутбуком: Wi-Fi, розетки, шум, цены, часы работы.">
  <!-- Pick the theme before the page draws, so it doesn't flash -->
  <script>
    (() => {
      const saved = localStorage.getItem("lb-theme");
      const light = saved ? saved === "light" : matchMedia("(prefers-color-scheme: light)").matches;
      document.documentElement.dataset.theme = light ? "light" : "dark";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Saira+Stencil+One&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 class="logo">Laptop <span>Bishkek</span></h1>
      <p class="tagline">Где в Бишкеке поработать с ноутбуком: Wi-Fi, розетки, тишина</p>
    </div>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Сменить тему"></button>
  </header>

  <main>
    <section class="filters" aria-label="Фильтры">
      <button class="chip" type="button" data-filter="quiet" aria-pressed="false">🤫 Тихо</button>
      <button class="chip" type="button" data-filter="sockets" aria-pressed="false">🔌 Розетки</button>
      <button class="chip" type="button" data-filter="late" aria-pressed="false">🌙 Допоздна</button>
      <button class="chip" type="button" id="near-me" aria-pressed="false">📍 Рядом со мной</button>
    </section>

    <p id="status" class="status" role="status"></p>
    <ul id="list" class="grid"></ul>
  </main>

  <footer class="foot">
    <p>Скорость Wi-Fi мы замеряем сами на месте. Пока проверенных мест мало: данные взяты из обзоров и уточняются.</p>
    <p id="updated"></p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
